узел мужской материи",short:"H1",hint:"Материальный опыт отца и деда: что они умели и теряли.",layer:"clan"},H2:{key:"H2",title:"Второй узел мужской материи",short:"H2",hint:"Глубокий слой: родовые деньги и потери мужской линии.",layer:"clan"},I1:{key:"I1",title:"Первый узел женской материи",short:"I1",hint:"Материальный опыт мамы и бабушки: достаток и бережливость.",layer:"clan"},I2:{key:"I2",title:"Второй узел женской материи",short:"I2",hint:"Глубокий слой: родовые деньги и потери женской линии.",layer:"clan"},M:{key:"M",title:"Точка баланса любви и денег",short:"M",hint:"Как отношения и внутреннее состояние влияют на доход. Гармония линии благополучия.",layer:"money"},ML:{key:"ML",title:"Сердце канала отношений",short:"ML",hint:"Партнёр и близость: как вы любите и что мешает открыться.",layer:"money"},MR:{key:"MR",title:"Центр денежного канала",short:"MR",hint:"Подходящие профессии, ниши и дело жизни для вашего аркана. Через что приходят деньги.",layer:"money"}},Ek=["E","A","B","C","D","MR","ML","M","A1","A2","A3","B1","B2","B3","C1","C2","D1","D2","F","G","H","I","F1","F2","G1","G2","H1","H2","I1","I2"];function Tk(e,n){if(!Number.isFinite(n)||n<1||n>22)return null;for(const s of Ek){const a=e[s];if(typeof a=="number"&&a===n)return s}return null}const Mk={Сахасрара:{organs:"Головной мозг, нервная система, макушка, гипофиз",overflow:"В минусе энергия утекает в бесконечные размышления: вы прокручиваете один разговор сотню раз, не можете уснуть от мыслей, чувствуете, что голова «перегрета». Часто это время, когда человек взял на себя чужую ответственность — быть главной, всё знать, всё решить.",restore:"Помогает тишина без телефона хотя бы 15 минут в день, прогулка без наушников, сон до полуночи. Хорошо работает всё, что выключает анализ: вода, дыхание, простая физическая работа. И честный вопрос себе: что я сейчас пытаюсь решить за других?",signs:["Мысли не выключаются, особенно перед сном","Чувство, что голова «перегрета» и не отдыхает","Тянет всех решать и всех спасать","Трудно побыть в тишине без телефона"]},Аджна:{organs:"Глаза, уши, нос, гипофиз; зрение и восприятие",overflow:"В минусе — привычка жить в чужих картинках: вы сравниваете себя с другими, верите чужим мнениям о себе больше, чем своим ощущениям. Энергия уходит в прокрутку чужих жизней в ленте. Часто это приводит к тому, что своё желание становится трудно разглядеть.",restore:"Помогает ограничить ленту хотя бы на день и записать три своих желания без оглядки на других. Хорошо действует всё, что возвращает в своё тело: описать, что вижу, слышу, чувствую прямо сейчас. И проверять чужие советы вопросом: а мне-то это подходит?",signs:["Сравниваю себя с другими и проигрываю","Свои желания неясны, чужие понятны","Много времени в ленте без удовольствия","Трудно принять решение без чужого одобрения"]},Вишудха:{organs:"Горло, щитовидная железа, голосовые связки, шея",overflow:"В минусе энергия застревает в горле: вы молчите, когда хочется сказать, или наоборот говорите резко и потом жалеете. Постоянное «проглотить и промолчать» даёт ком в горле, напряжение в шее, ощущение, что вас не слышат.",restore:"Помогает говорить о себе маленькими шагами: сначала с одним безопасным человеком. Хорошо работает пение — оно физически снимает зажим в горле. И полезно замечать момент, когда вы соглашаетесь, хотя не хотите: это и есть точка утечки.",signs:["Молчу, хотя есть что сказать","Ком в горле, напряжение в шее","Говорю резко и потом жалею","Чувство, что меня не слышат"]},Анахата:{organs:"Сердце, лёгкие, грудная клетка, бронхи",overflow:"В минусе — привычка терпеть ради других: вы сглаживаете, уступаете, боитесь расстроить. Энергия уходит в переживания за близких, а на себя не остаётся. Часто это старые обиды, которые вы носите годами и не выпускаете.",restore:"Помогает честно назвать, на кого вы обижены, хотя бы в дневнике — не для ссоры, а чтобы выпустить. Хорошо работает забота о себе наравне с заботой о других: сначала себе, потом остальным. И тепло физическое — объятия, тёплый душ, мягкое одеяло.",signs:["Терплю, чтобы не расстроить других","Обиды держатся годами","О себе думаю в последнюю очередь","Тяжесть в груди, трудно дышать глубоко"]},Манипура:{organs:"Желудок, печень, поджелудочная, селезёнка, кишечник",overflow:"В минусе утекает в контроль и тревогу о деньгах: вы берёте всё на себя, боитесь, что без вас развалится, и злитесь, когда не оценили. Часто это напряжение в животе, тяжесть после еды, когда приходится всё время держать оборону.",restore:"Помогает отдать часть дел другим и выдержать, что сделают не так, как вы. Хорошо работает порядок в деньгах: понятный бюджет снимает половину тревоги. И телесное — расслабить живот, подышать в него, поесть спокойно, а не на бегу.",signs:["Беру всё на себя и устаю","Боюсь, что без меня развалится","Злюсь, когда меня не ценят","Напряжение в животе, тяжесть после еды"]},Свадхистана:{organs:"Репродуктивная система, почки, мочевой пузырь",overflow:"В минусе — утекание в удовольствия вместо радости: еда, покупки, сериалы, чтобы заглушить пустоту. Или наоборот, полный отказ от радости: «не заслужила», «не до этого». Часто это обида на партнёра и ощущение, что желать для себя неприлично.",restore:"Помогает возвращать маленькие радости осознанно: не «заесть», а выбрать и почувствовать. Хорошо работает вода — ванна, бассейн, просто много пить. И честный вопрос: чего я хочу сейчас, если никто не осудит?",signs:["Заедаю или закупаю, чтобы заглушить пустоту","Радость кажется незаслуженной","Обида на партнёра, нет близости","Трудно понять, чего хочу"]},Муладхара:{organs:"Ноги, кости, опорно-двигательный аппарат, прямая кишка",overflow:"В минусе энергия уходит в страх: о будущем, о деньгах, о том, что не справлюсь. Вы всё время в напряжении, не чувствуете опоры, боитесь остаться без поддержки. Физически это часто проявляется в ногах и спине — тяжело стоять, болит поясница.",restore:"Помогает физическая опора: ходить пешком, стоять на земле, делать простые дела руками. Хорошо работает порядок в базовом — сон, еда, деньги на месяц вперёд: это возвращает чувство почвы. И память о роде: у вас есть корни, вы не одна.",signs:["Постоянная тревога о будущем","Нет чувства опоры под ногами","Боюсь остаться без поддержки","Тяжесть в ногах, болит спина"]}};function Ak(e){return Mk[e]??{organs:"Системы тела, связанные с этой чакрой",overflow:"В минусе энергия утекает в напряжение и тревогу.",restore:"Восстановление приходит через отдых, сон и заботу о теле.",signs:[]}}const Pk="Это психосоматические ориентиры, а не медицинская помощь. Мы показываем, где может утекать энергия и на что обратить внимание. Если что-то беспокоит — обратитесь к специалисту: приложение не заменяет обследование.",Lk={1:{feel:"Год начала: появляется желание что-то изменить, начать своё, выйти из привычной колеи.",task:"Начать. Даже если страшно и непонятно как — сделать первый шаг, а не готовиться к нему.",opens:"Новые знакомства, проекты, предложения. Люди приходят сами, если вы заявляете о себе.",watch:"Не распыляться: соблазн схватиться за пять дел сразу и не довести ни одно.",avoid:"Ждать идеального момента. Он не наступит, а год начала проходит."},2:{feel:"Год тишины и накопления: внешне мало событий, внутри много понимания.",task:"Разобраться в себе и в отношениях. Услышать своё желание отдельно от чужих.",opens:"Глубина, интуиция, понимание людей. Хорошее время для учёбы и разбора себя.",watch:"Не уйти в изоляцию. Тишина нужна, но затворничество вредит.",avoid:"Ждать, что догадаются сами. Говорить о своих желаниях придётся словами."},3:{feel:"Год тепла и плодородия: хочется заботиться, обустраивать, растить.",task:"Заботиться о себе так же, как о других. Наполнить свой дом и тело.",opens:"Беременность, рост в делах, укрепление семьи, женское окружение.",watch:"Не раствориться в других. Если на себя не остаётся — год уйдёт в усталость.",avoid:"Терпеть неудобство ради мира. Сказать «мне так не подходит» — нормально."},4:{feel:"Год порядка и опоры: хочется системы, стабильности, ясных правил.",task:"Построить то, что будет держать: доход, дом, распорядок, границы.",opens:"Рост дохода, повышение, укрепление авторитета, решение бытовых вопросов.",watch:"Не превратиться в контролёра. Порядок — для жизни, а не вместо неё.",avoid:"Брать всё на себя. Делегировать — это не слабость."},5:{feel:"Год учителя: хочется передать опыт, навести порядок в знаниях, собрать людей.",task:"Передать то, что знаете. Начать учить, наставлять, вести за собой.",opens:"Признание опыта, ученики, авторитет, рост в профессии или духовной практике.",watch:"Не поучать там, где не просят. Совет ценен, когда его ждут.",avoid:"Застыть в правилах. То, что работало десять лет назад, сегодня может мешать."},6:{feel:"Год выбора: обостряются отношения, становится ясно, где вы не на своём месте.",task:"Выбрать. Сердцем, а не из страха. И признать выбор вслух.",opens:"Настоящая близость, встреча, соединение, начало отношений или новый этап в паре.",watch:"Не идеализировать. Человек рядом — живой, а не образ из мечты.",avoid:"Оставаться из привычки или из страха остаться одной."},7:{feel:"Год движения: хочется ехать, менять, достигать. Энергии много.",task:"Доехать до цели. Не начать новое, а довести начатое до результата.",opens:"Победы, повышения, переезд, рост в конкурентной среде, крупные проекты.",watch:"Не загнать себя. Движение без отдыха заканчивается истощением.",avoid:"Соревноваться там, где можно договориться."},8:{feel:"Год ясности и справедливости: станет видно, где вы поступаете против себя.",task:"Навести порядок в делах и отношениях. Честно, даже если неудобно.",opens:"Юридические вопросы решаются, документы, договоры, восстановление справедливости.",watch:"Не судить других. Различать вину и ответственность.",avoid:"Ждать, что справедливость придёт сама. За неё нужно действовать."},9:{feel:"Год тишины и глубины: тянет к знанию, уединению, размышлению.",task:"Разобраться, что ваше, а что чужое. Отпустить лишнее.",opens:"Прозрение, понимание сути, учёба, исследование, духовный рост.",watch:"Не уйти в одиночество совсем. Люди нужны даже в год тишины.",avoid:"Прятаться в теории. Знание без действия остаётся книжным."},10:{feel:"Год потока и перемен: события идут сами, важно не сопротивляться.",task:"Поймать волну. Меняться, пробовать, не цепляться за старое.",opens:"Удача, случайные встречи, неожиданные предложения, смена обстановки.",watch:"Не пустить всё на самотёк. Поток помогает идущему, а не лежащему.",avoid:"Играть с судьбой. Риск ради азарта заканчивается потерей."},11:{feel:"Год силы и нагрузки: много дел, много энергии, мало отдыха.",task:"Выдержать и не сломаться. Направить силу в дело, а не в ссоры.",opens:"Мощный рост, крупные задачи, физическая форма, руководство.",watch:"Не выгореть. Сила восстанавливается только отдыхом.",avoid:"Давить силой. Давление возвращается конфликтом."},12:{feel:"Год переосмысления: привычное больше не радует, хочется иначе.",task:"Посмотреть на свою жизнь другими глазами. Отпустить то, что не работает.",opens:"Новый взгляд, освобождение от старого, помощь другим в их тупике.",watch:"Не застрять в роли жертвы. Жалеть себя — значит стоять на месте.",avoid:"Ждать, что всё изменится само. Год даёт понимание, действие — ваше."},13:{feel:"Год завершений и перемен: что-то заканчивается, освобождая место.",task:"Завершить. Отпустить людей и дела, которые давно закончились.",opens:"Освобождение, обновление, новая глава, избавление от лишнего.",watch:"Не бояться потерь. То, что уходит, освобождает место нужному.",avoid:"Держать умирающие отношения и проекты из страха пустоты."},14:{feel:"Год мягких перемен: состояние восстанавливается, приходит спокойствие.",task:"Соединить разное: работу и дом, своё и чужое, тело и чувства.",opens:"Здоровье, творчество, новые умения, спокойный рост без надрыва.",watch:"Не брать чужую ответственность. Спасать всех — не ваша задача.",avoid:"Разбрасываться. Лучше одно до конца, чем три наполовину."},15:{feel:"Год обнажения: станет видно, где вы теряете себя и играете не свою роль.",tas ой работы, расставанием, переездом. Это не потери, а расчистка места под себя.",signs:["У вас есть дело, которое вы делаете для себя, а не для одобрения","Вы можете сказать «мне так не подходит» без оправданий","Ваш доход не зависит целиком от одного человека","Вы знаете, что любите, и не стыдитесь этого"],blocks:"Мешает привычка ждать разрешения: от родителей, мужа, начальника. Ещё мешает страх заявить о себе — «неудобно», «а что подумают». Пока вы выбираете чужое удобство вместо своего пути, личное предназначение стоит на месте."}},{key:"social",label:"Социальное предназначение",age:"40–60 лет",short:"Принести пользу людям через своё дело",guide:{summary:"Здесь вы выходите за пределы себя: то, что вы умеете, становится нужным другим людям. Социальное предназначение соединяет мужскую и женскую линии рода — то, что вы взяли от отца и деда, и то, что от матери и бабушки. Это ваш вклад в мир через работу.",how:"Проявляется в признании: вас начинают звать, рекомендовать, спрашивать совета. Появляются ученики, клиенты, команда. Дело перестаёт быть только вашим — оно становится полезным сообществу. Часто именно в этом возрасте приходит настоящее профессиональное имя.",signs:["К вам приходят за опытом, а не только за услугой","Ваше дело приносит пользу, которую видно со стороны","Вы умеете работать с людьми, не теряя себя","Вам платят за то, что вы любите делать"],blocks:"Мешает синдром самозванца: «кто я такая, чтобы учить». Ещё мешает привычка делать всё самой, не пуская других. И мешает страх публичности — если вас не видно, польза остаётся в четырёх стенах."}},{key:"spiritual",label:"Духовное предназначение",age:"главное",short:"Главное: передать знание и опыт дальше",guide:{summary:"Это ГЛАВНОЕ предназначение — итог личного и социального. Оно собирается из двух предыдущих: то, что вы нашли в себе, и то, что отдали людям, складывается в понимание, зачем вы здесь. Духовное предназначение — не про религию, а про глубину и передачу.",how:"Проявляется в спокойствии и ясности: вы знаете, что важно, и не тратите силы на суету. Хочется передать опыт — написать, научить, вырастить кого-то. Часто в этом периоде приходит интерес к роду, к смыслу, к тому, что больше повседневности.",signs:["Вы понимаете, зачем делаете то, что делаете","Хочется передать опыт, а не только заработать","Вам спокойно наедине с собой","Вы видите смысл даже в трудных периодах"],blocks:"Мешает погоня за внешним: статусом, количеством, чужими мерками успеха. Ещё мешает страх тишины — когда человек боится остаться с собой, он заполняет жизнь делами и не слышит главного."}},{key:"planetary",label:"Планетарное предназначение",age:"высшая миссия",short:"Задача, ради которой вы пришли в это время",guide:{summary:"Это самое широкое: задача, с которой вы пришли в мир именно сейчас, в эту эпоху. Планетарное предназначение не про профессию и не про семью — оно про то, что изменится в мире, потому что вы были. Часто оно звучит слишком просто, чтобы в это поверить: научить женщин любить себя, сохранить ремесло, вырастить детей по-новому, вернуть людям веру в доброе.",how:"Проявляется в том, что вас тянет к теме снова и снова, даже если за неё не платят. Вы возвращаетесь к ней годами. И часто именно то, что вы считаете своим недостатком или болью, оказывается вашим вкладом: пройдя путь, вы помогаете пройти его другим.",signs:["Есть тема, к которой вы возвращаетесь годами","Вы хотите изменить что-то не только у себя","Вам важно, чтобы после вас осталось что-то нужное","Ваш опыт помогает другим людям"],blocks:"Мешает обесценивание: «это слишком просто», «так может каждый», «мир не изменится из-за меня». Планетарная задача всегда выглядит скромно для того, кто её несёт, — и огромно со стороны."}}];function c3(e,n){return n==="personal"?e<20?"future":e<=40?"now":"past":n==="social"?e<40?"future":e<=60?"now":"past":"now"}function u3(e){return e==="now"?"сейчас":e==="past"?"период пройден":"впереди"}function Wu(e){return e?e.split(new RegExp("(?<=\\.)\\s+(?=[А-ЯЁA-Z])")).map(n=>n.tr ли +30 дней бесплатно за подругу →"}),m]})]})]})}const y3={D1:{role:"Точка входа в отношения",question:"Кого вы притягиваете и как входите в близость",meaning:"Это ваша дверь в отношения — то, каким вы видите партнёра и что считаете любовью. Энергия этой точки определяет, какие мужчины к вам подходят, а какие будут чужими, даже если внешне всё хорошо. Здесь же лежит верх кармического хвоста: сценарий, который повторяется из отношений в отношения, пока не будет осознан.",plus:"В плюсе вы ясно чувствуете, кто ваш, и не тратите годы на неподходящих. Отношения складываются естественно, без борьбы и доказательств.",minus:"В минусе притягиваются одни и те же типажи: холодные, занятые, недоступные. Вы снова и снова проходите один урок, удивляясь, почему «все мужчины такие».",action:"Выпишите, каким вы видите идеального партнёра. Посмотрите на три последних отношения: что в них было общее? Это и есть ваш сценарий входа — с ним и работаем."},ML:{role:"Сердце канала отношений",question:"Как вы любите и что ищете в близости",meaning:"Это сердце вашей любви — то, как вы умеете быть близко. Не кого выбираете, а как любите: умеете ли открываться, просить, принимать заботу, быть слабой рядом. Энергия этой точки показывает, что для вас настоящая близость, а что её заменяет.",plus:"В плюсе вы умеете быть открытой и при этом не растворяться. Рядом с вами тепло, и партнёр чувствует, что его принимают настоящим.",minus:"В минусе близость подменяется: заботой вместо нежности, контролем вместо доверия, терпением вместо разговора. Вы рядом, но по-настоящему не открываетесь.",action:"Вспомните момент, когда вам было по-настоящему тепло с человеком. Что вы делали? А теперь вспомните, чего вы не позволяете себе в отношениях. Это и есть точка роста."},M:{role:"Точка баланса любви и денег",question:"Когда в паре спокойно и всё на своих местах",meaning:"Это точка, где любовь и деньги встречаются. Она показывает состояние, в котором в отношениях спокойно, а доход идёт: не «или любовь, или карьера», а когда одно поддерживает другое. Энергия этой точки — ваш внутренний баланс.",plus:"В плюсе вы не выбираете между семьёй и делом: получается и то и другое. Деньги приходят ровно, отношения не требуют надрыва.",minus:"В минусе качели: много любви — нет денег, много денег — нет тепла. Или вы тащите всё на себе, потому что «без меня не справятся».",action:"Проверьте: в какую сторону у вас перекос прямо сейчас? Что нужно добавить — заботы о себе, спокойствия, или конкретных действий в деньгах?"},C1:{role:"Вход в денежный канал",question:"Что запускает деньги и какой блок пройти",meaning:"Это ваша дверь в деньги — то, через что доход входит в вашу жизнь. Здесь же лежит главный финансовый блок: установка из рода или личный страх, который перекрывает поток. Пока блок не пройден, деньги приходят волной и уходят.",plus:"В плюсе вы знаете, за что вам платят, и не боитесь называть цену. Деньги приходят стабильно и остаются.",minus:"В минусе доход нестабилен, хотя вы много работаете. Появляется ощущение «потолка», вины за деньги или страха, что отберут.",action:"Вспомните, что говорили о деньгах в вашей семье. «Богатые все воры», «не жили богато — и нечего начинать»? Это и есть блок, который стоит перекрывает вход."},MR:{role:"Центр денежного канала",question:"Через что приходят деньги и какое дело ваше",meaning:"Это сердце вашего дохода — то, через что деньги приходят именно вам. Не «работа вообще», а ваше дело: какая деятельность даёт и деньги, и удовольствие. Энергия этой точки показывает вашу профессию и способ реализации.",plus:"В плюсе вы заняты тем, что у вас хорошо получается, и за это платят. Работа не выжигает, а наполняет.",minus:"В минусе вы на чужом месте: деньги есть, а радости нет. Или наоборот: заняты любимым делом, но не умеете за него брать.",action:"Посмотрите список профессий ниже и отметьте те, что откликаются телом. Не «подходит по образованию», а «хочется». Это направление вашей реализации."},A:{role:"Ваш урок для родителей",question:"Чему вас научила семья и что вы приносите в род",meaning:"Это то, что вы взяли от родителей — их опыт, их характер, их способы жить. Но это же и ваш урок для них: то новое, что вы приносите в семью и чего у предыдущих поколений не было. Здесь видно, чем вы продолжаете род и чем его меняете.",plus:"В плюсе вы благодарны за то, что дали, и не повторяете того, что не подходит. Вы становитесь тем звеном, где сценарий меняется.",minus:"В минусе вы либо копируете родителей полностью, либо отвергаете их целиком. И то и другое держит вас в старом сценарии.",action:"Назовите три вещи, которые вы взяли от родителей с благодарностью, и одну, которую не хотите передавать дальше. Вторая — ваш вклад в изменение рода."},A2:{role:"Точка трения с мамой и детьми",question:"Где возникают обиды и недопонимание",meaning:"Это место стыковки поколений — здесь сталкиваются ваши взгляды и взгляды мамы, а потом и ваши с детьми. Трение возникает не из-за характера, а из-за разного опыта: они жили в другое время и мерили другими мерками.",plus:"В плюсе вы умеете говорить с мамой и с детьми без обвинений. Разные взгляды не мешают теплу — вы просто разные.",minus:"В минусе одни и те же обиды всплывают годами. Разговор превращается в выяснение, кто прав, и никто не слышит другого.",action:"Скажите маме одну фразу без спора и оправданий: вы понимаете, что она хотела как лучше. Часто именно это снимает многолетнее напряжение."},A1:{role:"Ключ к исцелению связи",question:"Что помогает выстроить тепло с родом",meaning:"Это ваш инструмент примирения — то, через что связь с родителями и детьми выходит в тепло. Не «поговорить и выяснить», а конкретное действие, которое работает именно у вас.",plus:"В плюсе в семье становится спокойно: обиды отпускают, разговоры идут, вы чувствуете поддержку рода за спиной.",minus:"В минусе вы носите обиду молча и ждёте, что первым шагнёт другой. Годы уходят, тепло не приходит.",action:"Сделайте один небольшой шаг к родным на этой неделе: позвоните без повода, привезите что-то просто так, вспомните вслух хорошее. Маленькое действие работает лучше большого разговора."}};function v3(e){return y3[e]??{role:"Точка матрицы",question:"Что означает эта энергия в вашей карте",meaning:"Энергия этой точки работает вместе с остальными узлами вашей матрицы.",plus:"В плюсе она даёт опору и ясность.",minus:"В минусе уводит в повторяющийся сценарий.",action:"Обратите внимание, как эта тема проявляется в вашей жизни сейчас."}}function Pn({code:e,value:n,defaultOpen:s=!1}){const[a,l]=k.useState(s),d=v3(e),u=ue(n);return i.jsxs("div",{className:`rounded-xl border p-3 transition-colors ${a?"border-[color:var(--metal-main)]/45 bg-white/[0.05]":"border-white/5 bg-white/[0.03]"}`,children:[i.jsxs("button",{type:"button",onClick:()=>{fe(),l(f=>!f)},className:"flex w-full items-start gap-3 text-left",children:[i.jsx(Be,{n,size:"sm"}),i.jsxs("div",{className:"min-w-0 flex-1",children:[i.jsx("div",{className:"text-[12.5px] uppercase tracking-[0.16em] text-gold/60",children:d.role}),i.jsx("div",{className:"mt-0.5 heading text-[15px] leading-tight text-[#F3ECDD]",children:Xt(n)}),i.jsx("div",{className:"mt-0.5 text-[13px] leading-snug text-[color:var(--text-muted)]",children:d.question})]}),i.jsx("span",{className:"mt-1 shrink-0 text-[12px] text-[color:var(--text-muted)]",children:a?"▾":"▸"})]}),a&&i.jsxs("div",{className:"mt-3 space-y-3",children:[i.jsx("p",{className:"text-[13.5px] leading-relaxed text-[color:var(--text-body)]",children:d.meaning}),i.jsxs("div",{className:"grid gap-2 sm:grid-cols-2",children:[i.jsxs("div",{className:"rounded-lg border border-[color:var(--gold-line)] bg-[color:var(--chip-bg)] px-3 py-2.5",children:[i.jsxs("div",{className:"flex items-center gap-1.5 text-[12.5px] uppercase tracking-[0.14em] text-[color:var(--metal-light)]",children:[i.jsx("span",{"aria-hidden":"true",children:"◆"})," В плюсе"]}),i.jsx("p",{className:"mt-1 text-[13px] leading-relaxed text-[color:var(--text-body)]",children:d.plus})]}),i.jsxs("div",{className:"rounded-lg bord
